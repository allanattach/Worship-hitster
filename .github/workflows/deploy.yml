name: Deploy to GitHub Pages

on:
  push:
    # Both are listed while the repository moves over to main. Only whichever
    # is currently the default branch actually publishes — see the deploy job.
    branches: [main, claude/hitsper-sullet-webapp-3fjsz9]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deployment finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run build
        env:
          # Optional: set a repository variable of this name to point the build
          # at a Spotify app without editing src/config.ts. Not a secret — with
          # PKCE the Client ID is public by design.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}

      - uses: actions/configure-pages@v5
        with:
          # Turns GitHub Pages on for this repo the first time this runs.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # The github-pages environment rejects deployments from any branch other
    # than the default one — verified: a run from main had its deploy job
    # refused before a runner was even assigned. So publishing follows whatever
    # the default branch currently is, and other branches build and lint only.
    if: github.ref_name == github.event.repository.default_branch
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
